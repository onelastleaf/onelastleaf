syntax = "proto3";

package oll.protocol;

import "google/protobuf/any.proto";

// Identifiers are opaque UTF-8 strings. Implementations should use UUIDs or an
// equally collision-resistant representation, but peers must not parse them.
message NodeId { string value = 1; }

// A durable human-facing node name. Implementations validate the lowercase
// DNS-label syntax documented in architecture.md.
message NodeName { string value = 1; }

// NodeId and NodeName are both required and have a durable one-to-one
// relationship. A node presents this same pair at every local and remote
// protocol boundary.
message NodeIdentity {
  NodeId node_id = 1;
  NodeName node_name = 2;
}

message ReplicaId { string value = 1; }

message DocumentId { string value = 1; }

message CatalogNodeId { string value = 1; }

message Revision {
  // An opaque, stable token representing the observed state of one catalog or
  // document object.
  // This intentionally does not expose Loro's frontier or version-vector API.
  bytes token = 1;
}

message TraceContext {
  string correlation_id = 1;
  optional uint64 parent_call_id = 2;
  uint32 call_depth = 3;
  uint32 causal_depth = 4;
  optional string task_id = 5;
  optional string task_group_id = 6;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_ALREADY_EXISTS = 3;
  ERROR_CODE_REVISION_CONFLICT = 4;
  ERROR_CODE_CALL_DEPTH_EXCEEDED = 5;
  ERROR_CODE_CAUSAL_DEPTH_EXCEEDED = 6;
  ERROR_CODE_DEADLINE_EXCEEDED = 7;
  ERROR_CODE_CANCELLED = 8;
  ERROR_CODE_UNAVAILABLE = 9;
  ERROR_CODE_PROTOCOL_MISMATCH = 10;
  ERROR_CODE_FAILED_PRECONDITION = 11;
  ERROR_CODE_INTERNAL = 12;
  ERROR_CODE_PAYLOAD_TOO_LARGE = 13;
  ERROR_CODE_UNSUPPORTED = 14;
}

message ProtocolError {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  map<string, string> metadata = 4;
  repeated google.protobuf.Any details = 5;
}
