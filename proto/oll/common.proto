syntax = "proto3";

package oll.protocol;

import "google/protobuf/any.proto";

// Node IDs are canonical UUID v4 strings. They identify a node but do not carry
// routing, authority, or other application semantics.
message NodeId { string value = 1; }

// A durable human-facing node name. Implementations validate the lowercase
// DNS-label syntax documented in architecture.md.
message NodeName { string value = 1; }

// NodeId and NodeName are both required and have a durable one-to-one
// relationship. A node presents this same pair at every local and remote
// protocol boundary.
message NodeIdentity {
  NodeId node_id = 1;
  NodeName node_name = 2;
}

// Shared structured-log severity used by host and plugin records.
enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_TRACE = 1;
  LOG_LEVEL_DEBUG = 2;
  LOG_LEVEL_INFO = 3;
  LOG_LEVEL_WARN = 4;
  LOG_LEVEL_ERROR = 5;
}

message ReplicaId { string value = 1; }

message DocumentId { string value = 1; }

message CatalogNodeId { string value = 1; }

message BinaryId { string value = 1; }

// Immutable publisher identity used for package, process, job, and filesystem
// ownership. Its dotted path-safe grammar is defined in plugin-storage.md.
message PluginId { string value = 1; }

// Mutable unique human-facing selector. Changing it never changes PluginId or
// moves PluginId-keyed storage.
message PluginName { string value = 1; }

// Host-generated canonical UUID v4 for one asynchronous plugin job.
message PluginJobId { string value = 1; }

// Plugin-generated canonical UUID v4, unique within the deployment, for one
// verified artifact transfer and result.
message PluginArtifactId { string value = 1; }

message CatalogRevision {
  // An opaque token representing the observed catalog state of one
  // CatalogNodeId. This intentionally does not expose Loro's frontier or
  // version-vector API.
  bytes token = 1;
}

message DocumentRevision {
  // An opaque token representing the observed content and abstract CRDT state
  // of one DocumentId. This intentionally does not expose Loro's frontier or
  // version-vector API.
  bytes token = 1;
}

message TraceContext {
  string correlation_id = 1;
  optional uint64 parent_call_id = 2;
  uint32 call_depth = 3;
  uint32 causal_depth = 4;
  optional string task_id = 5;
  optional string task_group_id = 6;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_ALREADY_EXISTS = 3;
  ERROR_CODE_REVISION_CONFLICT = 4;
  ERROR_CODE_CALL_DEPTH_EXCEEDED = 5;
  ERROR_CODE_CAUSAL_DEPTH_EXCEEDED = 6;
  ERROR_CODE_DEADLINE_EXCEEDED = 7;
  ERROR_CODE_CANCELLED = 8;
  ERROR_CODE_UNAVAILABLE = 9;
  ERROR_CODE_PROTOCOL_MISMATCH = 10;
  ERROR_CODE_FAILED_PRECONDITION = 11;
  ERROR_CODE_INTERNAL = 12;
  ERROR_CODE_PAYLOAD_TOO_LARGE = 13;
  ERROR_CODE_UNSUPPORTED = 14;
}

message ProtocolError {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  map<string, string> metadata = 4;
  repeated google.protobuf.Any details = 5;
}
