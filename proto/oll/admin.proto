syntax = "proto3";

package oll.protocol;

import "google/protobuf/timestamp.proto";
import "oll/common.proto";
import "oll/document.proto";

// Local administration is served only over the daemon's Unix domain socket.
// This service is extended stage by stage; it must not grow stringly typed
// command forwarding for unimplemented subsystems.
service Admin {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc Shutdown(AdminShutdownRequest) returns (AdminShutdownResponse);
  rpc SetLogFilter(SetLogFilterRequest) returns (SetLogFilterResponse);
  rpc InspectReplicaDocument(InspectReplicaDocumentRequest)
      returns (InspectReplicaDocumentResponse);
  rpc ListReplicaOperations(ListReplicaOperationsRequest)
      returns (ListReplicaOperationsResponse);
  rpc ExportReplica(ExportReplicaRequest) returns (ExportReplicaResponse);
  rpc ImportReplica(ImportReplicaRequest) returns (ImportReplicaResponse);
}

// Every unary Admin request carries this context. Exact fingerprint equality is
// required because the local Admin API does not negotiate schema versions.
message AdminCallContext {
  bytes protocol_schema_sha256 = 1;
  TraceContext trace = 2;
}

enum NodeLifecycleState {
  NODE_LIFECYCLE_STATE_UNSPECIFIED = 0;
  NODE_LIFECYCLE_STATE_STARTING = 1;
  NODE_LIFECYCLE_STATE_RUNNING = 2;
  NODE_LIFECYCLE_STATE_STOPPING = 3;
}

enum PeerConnectionState {
  PEER_CONNECTION_STATE_UNSPECIFIED = 0;
  PEER_CONNECTION_STATE_PENDING = 1;
  PEER_CONNECTION_STATE_CONNECTING = 2;
  PEER_CONNECTION_STATE_READY = 3;
  PEER_CONNECTION_STATE_BACKOFF = 4;
}

enum ReplicaState {
  REPLICA_STATE_UNSPECIFIED = 0;
  REPLICA_STATE_UNINITIALIZED = 1;
  REPLICA_STATE_INITIALIZED_EMPTY = 2;
  REPLICA_STATE_INITIALIZED_POPULATED = 3;
}

// Native Unix pathname bytes used only by the local Admin UDS. Values must be
// non-empty absolute paths with no NUL byte.
message NativePath { bytes unix_path = 1; }

message PeerStatus {
  string connect_url = 1;
  // Absent until a successful SyncHello establishes the remote identity.
  NodeIdentity node = 2;
  PeerConnectionState connection_state = 3;
}

message GetStatusRequest { AdminCallContext context = 1; }

message GetStatusResponse {
  NodeIdentity node = 1;
  NodeLifecycleState lifecycle = 2;
  google.protobuf.Timestamp started_at = 3;
  uint32 process_id = 4;
  repeated PeerStatus peers = 5;
  // The effective deployment configuration, not a claim that a later sync
  // listener has already bound the address.
  optional string configured_listen_address = 6;
  ReplicaState replica_state = 7;
  // Present only for initialized replica states.
  optional ReplicaId replica_id = 8;
}

message AdminShutdownRequest {
  AdminCallContext context = 1;
  string reason = 2;
}

// Acceptance is returned before the daemon begins ordered shutdown so the
// response is not lost when the Admin UDS closes.
message AdminShutdownResponse { bool accepted = 1; }

// The CLI parses a directive such as "oll::sync=trace" before constructing this
// typed request. The setting is live-only and resets when the daemon exits.
message SetLogFilterRequest {
  AdminCallContext context = 1;
  string target = 2;
  LogLevel level = 3;
}

message SetLogFilterResponse {
  string target = 1;
  LogLevel level = 2;
}

message InspectReplicaDocumentRequest {
  AdminCallContext context = 1;
  NativePath document_path = 2;
}

message InspectReplicaDocumentResponse {
  CatalogNodeId catalog_node_id = 1;
  CatalogRevision catalog_revision = 2;
  DocumentId document_id = 3;
  DocumentRevision document_revision = 4;
  DocumentPath path = 5;
  string media_type = 6;
  string encoding = 7;
  bool has_byte_order_mark = 8;
  uint64 size_bytes = 9;
}

enum ReplicaOperationSource {
  REPLICA_OPERATION_SOURCE_UNSPECIFIED = 0;
  REPLICA_OPERATION_SOURCE_FILESYSTEM = 1;
  REPLICA_OPERATION_SOURCE_PLUGIN = 2;
  REPLICA_OPERATION_SOURCE_SYNC = 3;
  REPLICA_OPERATION_SOURCE_SNAPSHOT_IMPORT = 4;
}

enum ReplicaOperationKind {
  REPLICA_OPERATION_KIND_UNSPECIFIED = 0;
  REPLICA_OPERATION_KIND_CREATE = 1;
  REPLICA_OPERATION_KIND_UPDATE = 2;
  REPLICA_OPERATION_KIND_MOVE = 3;
  REPLICA_OPERATION_KIND_DELETE = 4;
  REPLICA_OPERATION_KIND_REPLACE = 5;
}

message ReplicaOperation {
  google.protobuf.Timestamp timestamp = 1;
  string operation_id = 2;
  ReplicaOperationSource source = 3;
  ReplicaOperationKind kind = 4;
  CatalogNodeId catalog_node_id = 5;
  DocumentId document_id = 6;
  optional DocumentPath path_before = 7;
  optional DocumentPath path_after = 8;
  string correlation_id = 9;
}

message ListReplicaOperationsRequest {
  AdminCallContext context = 1;
  NativePath document_path = 2;
  uint64 limit = 3;
}

message ListReplicaOperationsResponse {
  repeated ReplicaOperation operations = 1;
}

message ExportReplicaRequest {
  AdminCallContext context = 1;
  NativePath snapshot_path = 2;
}

message ExportReplicaResponse {
  string snapshot_id = 1;
  ReplicaId replica_id = 2;
}

message ImportReplicaRequest {
  AdminCallContext context = 1;
  NativePath snapshot_path = 2;
}

message ImportReplicaResponse {
  string snapshot_id = 1;
  ReplicaId replica_id = 2;
}
