syntax = "proto3";

package oll.protocol;

import "google/protobuf/timestamp.proto";
import "oll/common.proto";

// Local administration is served only over the daemon's Unix domain socket.
// This service is extended stage by stage; it must not grow stringly typed
// command forwarding for unimplemented subsystems.
service Admin {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc Shutdown(AdminShutdownRequest) returns (AdminShutdownResponse);
  rpc SetLogFilter(SetLogFilterRequest) returns (SetLogFilterResponse);
}

// Every unary Admin request carries this context. Exact fingerprint equality is
// required because the local Admin API does not negotiate schema versions.
message AdminCallContext {
  bytes protocol_schema_sha256 = 1;
  TraceContext trace = 2;
}

enum NodeLifecycleState {
  NODE_LIFECYCLE_STATE_UNSPECIFIED = 0;
  NODE_LIFECYCLE_STATE_STARTING = 1;
  NODE_LIFECYCLE_STATE_RUNNING = 2;
  NODE_LIFECYCLE_STATE_STOPPING = 3;
}

enum PeerConnectionState {
  PEER_CONNECTION_STATE_UNSPECIFIED = 0;
  PEER_CONNECTION_STATE_PENDING = 1;
  PEER_CONNECTION_STATE_CONNECTING = 2;
  PEER_CONNECTION_STATE_READY = 3;
  PEER_CONNECTION_STATE_BACKOFF = 4;
}

message PeerStatus {
  string connect_url = 1;
  // Absent until a successful SyncHello establishes the remote identity.
  NodeIdentity node = 2;
  PeerConnectionState connection_state = 3;
}

message GetStatusRequest { AdminCallContext context = 1; }

message GetStatusResponse {
  NodeIdentity node = 1;
  NodeLifecycleState lifecycle = 2;
  google.protobuf.Timestamp started_at = 3;
  uint32 process_id = 4;
  repeated PeerStatus peers = 5;
  // The effective deployment configuration, not a claim that a later sync
  // listener has already bound the address.
  optional string configured_listen_address = 6;
}

message AdminShutdownRequest {
  AdminCallContext context = 1;
  string reason = 2;
}

// Acceptance is returned before the daemon begins ordered shutdown so the
// response is not lost when the Admin UDS closes.
message AdminShutdownResponse { bool accepted = 1; }

// The CLI parses a directive such as "oll::sync=trace" before constructing this
// typed request. The setting is live-only and resets when the daemon exits.
message SetLogFilterRequest {
  AdminCallContext context = 1;
  string target = 2;
  LogLevel level = 3;
}

message SetLogFilterResponse {
  string target = 1;
  LogLevel level = 2;
}
