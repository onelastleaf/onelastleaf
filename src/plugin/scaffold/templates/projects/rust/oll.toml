format_version = 1

[plugin]
id = "__OLL_PLUGIN_ID__"
name = "__OLL_PLUGIN_NAME__"

[source]
checkout = "source"
steps = [
  ["cargo", "install", "--locked", "--path", "{source}", "--root", "{install}"],
]

[source.dependencies]
"cargo" = "Install the Rust toolchain and ensure cargo is in PATH."

[runtime]
argv = ["{install}/bin/__OLL_PLUGIN_NAME__"]
