format_version = 1

[plugin]
id = "__OLL_PLUGIN_ID__"
name = "__OLL_PLUGIN_NAME__"

[source]
checkout = "install"
steps = [
  ["cabal", "install", "exe:__OLL_PLUGIN_NAME__", "--project-dir={install}", "--install-method=copy", "--installdir={install}", "--overwrite-policy=always"],
]

[source.dependencies]
"cabal" = "Install GHC and cabal-install and ensure cabal is in PATH."

[runtime]
argv = ["{install}/__OLL_PLUGIN_NAME__"]
