format_version = 1

[plugin]
id = "__OLL_PLUGIN_ID__"
name = "__OLL_PLUGIN_NAME__"

[source]
checkout = "source"
steps = [
  ["cmake", "-S", "{source}", "-B", "{source}/build", "-DCMAKE_BUILD_TYPE=Release", "-DBUILD_TESTING=OFF", "-DCMAKE_INSTALL_PREFIX={install}"],
  ["cmake", "--build", "{source}/build", "--target", "install", "--parallel"],
]

[source.dependencies]
"cmake" = "Install CMake, a C++ compiler, protobuf, and gRPC."

[runtime]
argv = ["{install}/bin/__OLL_PLUGIN_NAME__"]
