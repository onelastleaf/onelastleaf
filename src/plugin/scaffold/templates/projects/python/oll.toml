format_version = 1

[plugin]
id = "__OLL_PLUGIN_ID__"
name = "__OLL_PLUGIN_NAME__"

[source]
checkout = "generation"
steps = [
  ["uv", "sync", "--no-dev", "--project", "{generation}"],
]

[source.dependencies]
"uv" = "Install uv and ensure uv is in PATH."

[runtime]
argv = ["{generation}/.venv/bin/__OLL_PLUGIN_NAME__"]
