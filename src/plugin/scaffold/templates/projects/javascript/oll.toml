format_version = 1

[plugin]
id = "__OLL_PLUGIN_ID__"
name = "__OLL_PLUGIN_NAME__"

[source]
checkout = "install"
steps = [
  ["pnpm", "install", "--frozen-lockfile"],
]

[source.dependencies]
"pnpm" = "Install Node.js with pnpm and ensure pnpm is in PATH."

[runtime]
argv = ["node", "{install}/src/index.js"]
