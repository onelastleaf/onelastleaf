format_version = 1

[plugin]
id = "__OLL_PLUGIN_ID__"
name = "__OLL_PLUGIN_NAME__"

[source]
checkout = "source"
steps = [
  ["mix", "deps.get"],
  ["mix", "escript.build"],
  ["install", "-m", "755", "{source}/__OLL_PLUGIN_NAME__", "{install}/__OLL_PLUGIN_NAME__"],
]

[source.dependencies]
"mix" = "Install Elixir with Mix and ensure mix is in PATH."
"install" = "Install a POSIX install utility and ensure it is in PATH."

[runtime]
argv = ["{install}/__OLL_PLUGIN_NAME__"]
